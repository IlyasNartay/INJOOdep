server {
    listen 80;
    server_name www.injoo.kz;
    return 301 http://injoo.kz$request_uri;
}

server {
    listen 80;
    server_name injoo.kz;

    root /usr/share/nginx/html;
    index index.html;

    # --- Настройка Gzip ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256; # Не сжимать файлы меньше 256 байт

    # Типы файлов, которые нужно сжимать
    gzip_types
        application/javascript
        application/json
        application/xml
        application/xml+rss
        text/css
        text/plain
        text/javascript
        text/xml
        image/svg+xml;
    # -----------------------

    location / {
        try_files $uri $uri/ /index.html;
        client_max_body_size 100M;
    }

    location = /sitemap.xml {
        proxy_pass https://server.injoo.kz/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public";
    }
}