server {
    # Nginx слушает порт 80, который проксирует Traefik
    listen 80;

    # Указываем корневую директорию, куда ваш Dockerfile скопировал фронтенд-билд
    # Обычно это /usr/share/nginx/html
    root /usr/share/nginx/html;

    # Файл, который должен быть отдан по умолчанию
    index index.html;

    # Основной блок обработки запросов
    location / {
        # КЛЮЧЕВАЯ ДИРЕКТИВА для SPA:
        # 1. Попытаться найти запрошенный файл ($uri).
        # 2. Если файл не найден, попытаться найти папку ($uri/).
        # 3. Если ни то, ни другое не найдено, отдать index.html (для роутинга).
        try_files $uri $uri/ /index.html;
    }

    # Опционально: Настройка кэширования для статических ресурсов (ускоряет загрузку)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        # Запрещаем логировать 404 ошибки, если вдруг пропал какой-то favicon или старый файл
        log_not_found off;
    }
}