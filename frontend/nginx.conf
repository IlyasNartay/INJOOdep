server {
    listen 80;
    server_name injoo.kz www.injoo.kz;
    # Если у вас есть SSL, настройки ниже должны быть в блоке listen 443 ssl!

    root /usr/share/nginx/html;
    index index.html;

    # 1. Глобальные настройки Gzip (вне location)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # 2. Обработка SPA путей (типа /CliMain)
    location / {
        try_files $uri $uri/ /index.html;
        client_max_body_size 100M;
        # Убедимся, что index.html отдается как html
        default_type text/html;
    }

    # 3. Кэширование статики (с поддержкой gzip)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
        # Gzip применится автоматически, так как он включен на уровне server
    }

    location = /sitemap.xml {
        proxy_pass https://server.injoo.kz/sitemap.xml;
        proxy_set_header Host server.injoo.kz;
        proxy_set_header X-Real-IP $remote_addr;
    }
}