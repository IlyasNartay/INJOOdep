version: "3.9"

services:
  # --- Reverse Proxy ---
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    labels:
      com.github.nginx-proxy.nginx: "true"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs:rw
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    networks:
      - injoo_net

  # --- Let's Encrypt Companion ---
  letsencrypt:
    image: nginxproxy/acme-companion
    container_name: nginx-proxy-le
    restart: always
    depends_on:
      - nginx-proxy
    environment:
      NGINX_PROXY_CONTAINER: nginx-proxy
      DEFAULT_EMAIL: injoo.kaskelen@gmail.com
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs:rw
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    networks:
      - injoo_net

  # --- Backend ---
  injoo-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: injoo-app
    restart: always
    env_file:
      - .env
    expose:
      - "10000"
    environment:
      - VIRTUAL_HOST=injoo.duckdns.org
      - LETSENCRYPT_HOST=injoo.duckdns.org
      - LETSENCRYPT_EMAIL=injoo.kaskelen@gmail.com
    volumes:
      - ./uploaded_images:/app/uploaded_images
    depends_on:
      - db
    networks:
      - injoo_net

  # --- Database ---
  db:
    image: postgres:15
    container_name: injoo-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-injoo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-injoo_pass}
      POSTGRES_DB: ${POSTGRES_DB:-injoo_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - injoo_net

  # --- Frontend ---
  injoo-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: injoo-frontend
    restart: always
    expose:
      - "80"
    environment:
      - VIRTUAL_HOST=frontend.injoo.duckdns.org
      - LETSENCRYPT_HOST=frontend.injoo.duckdns.org
      - LETSENCRYPT_EMAIL=injoo.kaskelen@gmail.com
    depends_on:
      - injoo-app
    networks:
      - injoo_net

volumes:
  postgres_data:
  certs:
  vhost:
  html:

networks:
  injoo_net:
    driver: bridge
