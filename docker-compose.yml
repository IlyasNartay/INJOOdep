version: "3.9"

services:
  nginx:
    image: nginx:alpine
    container_name: injoo-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - injoo-app
      - injoo-frontend
    networks:
      - injoo_net

  injoo-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: injoo-app
    restart: always
    env_file:
      - .env
    expose:
      - "10000"
    volumes:
      - ./uploaded_images:/app/uploaded_images
    depends_on:
      - db
    networks:
      - injoo_net

  injoo-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: injoo-frontend
    restart: always
    # Vue билд создаётся во время сборки, потом nginx просто его берёт
    networks:
      - injoo_net

  db:
    image: postgres:15
    container_name: injoo-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-injoo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-injoo_pass}
      POSTGRES_DB: ${POSTGRES_DB:-injoo_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - injoo_net

volumes:
  postgres_data:

networks:
  injoo_net:
    driver: bridge
