version: "3.9"

services:
  backend:
    build: ./backend
    container_name: injoo-backend
    expose:
      - "10000"
    command: ./start.sh
    restart: always

  frontend:
    build: ./frontend
    container_name: injoo-frontend
    expose:
      - "80"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: injoo-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./frontend/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
